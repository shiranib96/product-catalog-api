spring:
  application:
    name: product-catalog-api
  threads:
    virtual:
      enabled: true
  # defaults match docker-compose.yml, override with env vars (SPRING_DATASOURCE_URL etc.)
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog
    username: catalog
    password: catalog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

catalog:
  source:
    base-url: http://localhost:9090
    page-size: 50
    sync-interval: PT5M
    connect-timeout: PT2S
    read-timeout: PT10S
    webhook:
      # where the source sends product and price changes to (our POST /api/v1/product-updates)
      callback-url: http://localhost:8080/api/v1/product-updates
      # used to sign the webhook calls, set CATALOG_SOURCE_WEBHOOK_SECRET outside local dev
      secret: local-dev-secret

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
