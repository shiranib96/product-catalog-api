name: product-catalog

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # fake source: serves the products and calls our webhook with product and price changes
  mock-source:
    image: python:3.13-alpine
    working_dir: /app
    command: ["python", "-u", "server.py"]
    volumes:
      - ./mock-source:/app:ro
    environment:
      PORT: "9090"
      CHANGE_INTERVAL: "10"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
      CATALOG_SOURCE_BASE_URL: http://mock-source:9090
      CATALOG_SOURCE_SYNC_INTERVAL: PT1M
      CATALOG_SOURCE_WEBHOOK_CALLBACK_URL: http://product-service:8080/api/v1/product-updates
      CATALOG_SOURCE_WEBHOOK_SECRET: local-dev-secret
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      mock-source:
        condition: service_healthy

volumes:
  postgres-data:
